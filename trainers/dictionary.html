const PAGES=[...new Set(WORDS.map(w=>w.p))].sort((a,b)=>a-b);

const app=document.getElementById("app");
let dir="en2ru";
let Q=null,timerId=null,timeLeft=15;

function speak(t){if(!("speechSynthesis"in window))return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t);u.lang="en-US";u.rate=.85;speechSynthesis.speak(u);}

const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const rnd=a=>a[Math.floor(Math.random()*a.length)];

function home(){
clearInterval(timerId);
app.innerHTML=`
<div class="nav-grid">
<div class="nav-card" onclick="startTheory()">
<h3>Theory · Pages 12-102</h3>
<div class="sub">All pages from the book</div>
<p>Complete vocabulary organized by exact page numbers. Add Cloudinary images for each page.</p>
</div>
<div class="nav-card" onclick="newQuiz()">
<h3>Quiz</h3>
<div class="sub">Choose translation</div>
<p>${WORDS.length}+ words with 15 sec timer.</p>
</div>
<div class="nav-card" onclick="startTyping()">
<h3>Type</h3>
<div class="sub">Keyboard input</div>
<p>The most difficult mode.</p>
</div>
<div class="nav-card" onclick="startCards()">
<h3>Flashcards</h3>
<div class="sub">Flip cards</div>
<p>Review words with cards.</p>
</div>
</div>
`;
}

function setDir(d){dir=d;home();}

function startTheory(){
clearInterval(timerId);
app.innerHTML=`
<div class="quiz">
<div class="top-bar">
<div class="cat-tag">Theory · ${PAGES.length} pages</div>
<button class="btn btn-ghost" onclick="home()">Back</button>
</div>
<div class="page-grid">
${PAGES.map(p=>{
const count=WORDS.filter(w=>w.p===p).length;
const hasImg=IMG[p]?"✓":"";
return `<div class="page-card" onclick="openPage(${p})">${hasImg?`<div class="img-ind">🖼️</div>`:""}<h4>Page ${p}</h4><div class="cnt">${count} words</div></div>`;
}).join("")}
</div>
</div>
`;
}

function openPage(p){
const ws=WORDS.filter(w=>w.p===p);
const img=IMG[p]||"";
app.innerHTML=`
<div class="quiz">
<div class="top-bar">
<div class="cat-tag">Page ${p} · ${ws.length} words</div>
<button class="btn btn-ghost" onclick="startTheory()">Back</button>
</div>
${img?`<img class="book-img" src="${img}">`:`<div class="img-ph">No image added for this page</div>`}
<div class="btns">
<button class="btn btn-ghost" onclick="pasteImg(${p})">📷 Add Cloudinary Image</button>
${img?`<button class="btn btn-ghost" onclick="removeImg(${p})">✕ Remove Image</button>`:""}
</div>
<div class="wordlist">
${ws.map(w=>`<div class="wrow"><button class="sound-btn" onclick="speak('${w.e.replace(/'/g,"\\'")}')">🔊</button><span class="en">${w.e}</span><span class="ipa">${w.ipa||""}</span><span class="ru">${w.r}</span></div>`).join("")}
</div>
<div class="btns">
<button class="btn btn-primary" onclick="newQuiz(${p})">Quiz</button>
<button class="btn btn-primary" onclick="startTyping(${p})">Type</button>
<button class="btn btn-ghost" onclick="startCards(${p})">Flashcards</button>
</div>
</div>
`;
}

function pasteImg(p){
const u=prompt("Enter Cloudinary image URL:");
if(u&&u.startsWith("http")){
IMG[p]=u.trim();
saveImg();
openPage(p);
}
}

function removeImg(p){
delete IMG[p];
saveImg();
openPage(p);
}

function showQuiz(o){
clearInterval(timerId);
Q=o;
const img=o.page&&IMG[o.page]?`<img class="book-img" src="${IMG[o.page]}" style="max-height:200px">`:"";
app.innerHTML=`
<div class="quiz">
<div class="top-bar">
<div class="cat-tag">${o.sub||""}</div>
<div class="timer-wrap">
<span id="tTxt">15s</span>
<div class="timer"><div class="timer-fill"></div></div>
</div>
</div>
<div class="word-display">
<div class="word-main">${o.prompt}</div>
${img}
<button class="btn btn-ghost" onclick="speak('${o.prompt.replace(/'/g,"\\'")}')">🔊 Pronunciation</button>
</div>
${o.options?`<div class="opts">${o.options.map((x,i)=>`<button class="opt" onclick="checkAns(${i})">${x.t}</button>`).join("")}</div>`:""}
${o.hasInput?`<input type="text" class="type-input" id="typeIn" placeholder="Type your answer..." autocomplete="off" spellcheck="false"><div class="hint">Press Enter to check</div>`:""}
<div class="info-box" id="infoBox"></div>
<div class="btns">
<button class="btn btn-ghost" onclick="home()">Back</button>
<button class="btn btn-primary" id="nextBtn" style="display:none" onclick="Q.next()">Next →</button>
</div>
</div>
`;
if(o.hasInput){
const i=document.getElementById("typeIn");
i.focus();
i.addEventListener("keydown",e=>{if(e.key==="Enter"&&!i.disabled)checkType();});
}
startTimer(timeOut);
}

function startTimer(end){
clearInterval(timerId);
timeLeft=15;
const f=document.querySelector(".timer-fill");
const x=document.getElementById("tTxt");
const u=()=>{
if(f){f.style.width=(timeLeft/15*100)+"%";if(timeLeft<=5)f.classList.add("warn");}
if(x)x.textContent=timeLeft+"s";
};
u();
timerId=setInterval(()=>{
timeLeft--;
u();
if(timeLeft<=0){
clearInterval(timerId);
end();
}
},1000);
}

function timeOut(){
if(Q.hasInput){
const i=document.getElementById("typeIn");
if(i)i.disabled=true;
}else{
document.querySelectorAll(".opt").forEach((b,i)=>{
b.disabled=true;
if(Q.options[i].ok)b.classList.add("correct");
});
}
stats.total++;
stats.streak=0;
updSt();
const x=document.getElementById("infoBox");
x.innerHTML="⏰ <b>Time is up!</b> "+Q.info;
x.classList.add("show");
document.getElementById("nextBtn").style.display="inline-block";
}

function checkAns(i){
clearInterval(timerId);
const b=[...document.querySelectorAll(".opt")];
b.forEach((x,idx)=>{
x.disabled=true;
if(Q.options[idx].ok)x.classList.add("correct");
});
if(!Q.options[i].ok)b[i].classList.add("wrong");
record(Q.options[i].ok);
}

function checkType(){
clearInterval(timerId);
const i=document.getElementById("typeIn");
const v=i.value.trim().toLowerCase();
const ok=Q.onType(v);
i.disabled=true;
i.classList.add(ok?"correct":"wrong");
record(ok);
}

function record(ok){
stats.total++;
if(ok){stats.correct++;stats.streak++;}
else stats.streak=0;
updSt();
const x=document.getElementById("infoBox");
x.innerHTML=(ok?"✅ <b>Correct!</b> ":"❌ <b>Not quite.</b> ")+Q.info;
x.classList.add("show");
document.getElementById("nextBtn").style.display="inline-block";
}

function newQuiz(page){
const src=page?WORDS.filter(w=>w.p===page):WORDS;
const w=rnd(src);
const e2r=dir==="en2ru";
const pool=shuffle(WORDS.filter(x=>x!==w&&x.r!==w.r)).slice(0,3);
showQuiz({
prompt:e2r?w.e:w.r,
sub:`Page ${w.p}`,
page:w.p,
options:shuffle([{t:e2r?w.r:w.e,ok:true},...pool.map(x=>({t:e2r?x.r:x.e,ok:false}))]),
info:`${w.e} ${w.ipa||""} — <b>${w.r}</b>`,
next:()=>newQuiz(page)
});
}

function startTyping(page){
const src=page?WORDS.filter(w=>w.p===page):WORDS;
const w=rnd(src);
const e2r=dir==="en2ru";
showQuiz({
prompt:e2r?w.e:w.r,
sub:`Page ${w.p} · typing`,
page:w.p,
hasInput:true,
onType:v=>{
const a=(e2r?w.r:w.e).toLowerCase().replace(/[()]/g,"").trim();
return v===a||v===(e2r?w.r:w.e).toLowerCase();
},
info:`Answer: <b>${e2r?w.r:w.e}</b> ${w.ipa||""}`,
next:()=>startTyping(page)
});
}

function startCards(page){
const src=page?WORDS.filter(w=>w.p===page):WORDS;
const deck=shuffle(src).slice(0,15);
let i=0,k=0,d=0;
const show=()=>{
if(i>=deck.length){
app.innerHTML=`<div class="quiz" style="text-align:center"><div style="font-size:56px">🎉</div><h2>Done!</h2><div class="word-sub">Knew: ${k} · Didn't: ${d}</div><div class="btns"><button class="btn btn-ghost" onclick="home()">← Menu</button><button class="btn btn-primary" onclick="startCards(${page||''})">Again</button></div></div>`;
return;
}
const w=deck[i];
const img=IMG[w.p]?`<img class="book-img" src="${IMG[w.p]}" style="max-height:200px">`:"";
app.innerHTML=`<div class="quiz"><div class="top-bar"><div class="cat-tag">Page ${w.p} · ${i+1}/${deck.length}</div><div class="timer-wrap">✅${k} ❌${d}</div></div>
<div class="word-display" style="cursor:pointer" onclick="flip(this)" data-f="0"><div class="word-main" id="cw">${w.e}</div><div class="word-sub" id="cs">click for translation</div>${img}<button class="btn btn-ghost" onclick="event.stopPropagation();speak('${w.e.replace(/'/g,"\\'")}')">🔊</button></div>
<div class="btns"><button class="btn btn-ghost" onclick="home()">← Menu</button><button class="btn" style="background:#ffebee;color:#8b3a3a;border:2px solid #000" onclick="cAns(0)">✕ Didn't know</button><button class="btn" style="background:#e8f5e9;color:#4a6a3a;border:2px solid #000" onclick="cAns(1)">✓ Knew</button></div></div>`;
window._w=w;
};
window.flip=el=>{
const w=window._w;
if(el.dataset.f==="0"){
document.getElementById("cw").textContent=w.r;
document.getElementById("cs").textContent=w.e;
el.dataset.f="1";
speak(w.e);
}else{
document.getElementById("cw").textContent=w.e;
document.getElementById("cs").textContent="click for translation";
el.dataset.f="0";
}
};
window.cAns=v=>{v?k++:d++;i++;show();};
show();
}

home();
console.log(`Loaded: ${WORDS.length} words across ${PAGES.length} pages`);
</script>
</body>
</html>
