          { text: "Did your son really paint this **himself**?", options: ["reflexive pronoun", "personal pronoun", "adverb", "noun"], correct: 0 },

          { text: "Peter **is walking** to school.", options: ["present continuous", "present simple", "gerund", "future"], correct: 0 },
          { text: "**I've decided** to take up French.", options: ["present perfect", "present simple", "past simple", "present perfect continuous"], correct: 0 },

        ]
      }
    ]
  }
];

// ============ СОСТОЯНИЕ ПРИЛОЖЕНИЯ ============
let state = {
  currentSection: 0,
  currentTest: 0,
  score: 0,
  totalAnswered: 0,
  totalCorrect: 0,
  answers: {}
};

// ============ РЕНДЕРИНГ ============
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  sections.forEach((sec, i) => {
    const btn = document.createElement('button');
    btn.textContent = `${sec.id}. ${sec.name}`;
    btn.className = i === state.currentSection ? 'active' : '';
    btn.onclick = () => {
      state.currentSection = i;
      state.currentTest = 0;
      renderAll();
    };
    nav.appendChild(btn);
  });
}

function renderContent() {
  const content = document.getElementById('content');
  const section = sections[state.currentSection];
  const test = section.tests[state.currentTest];
  
  let html = `<div class="test-header">
    <h2>Тест ${test.id}: ${test.title}</h2>
    <p>${test.instruction}</p>
  </div>`;
  
  if (test.type === 'fill') {
    html += renderFillTest(test);
  } else if (test.type === 'mcq') {
    html += renderMcqTest(test);
  } else if (test.type === 'transform') {
    html += renderTransformTest(test);
  } else if (test.type === 'error') {
    html += renderErrorTest(test);
  } else if (test.type === 'wordbuild') {
    html += renderWordBuildTest(test);
  }
  
  html += `<div class="controls">
    <button class="btn btn-primary" onclick="checkAnswers()">✓ Проверить ответы</button>
    <button class="btn btn-secondary" onclick="resetTest()">↺ Сбросить</button>
    ${state.currentTest > 0 ? `<button class="btn btn-secondary" onclick="prevTest()">← Предыдущий</button>` : ''}
    ${state.currentTest < section.tests.length - 1 ? `<button class="btn btn-success" onclick="nextTest()">Следующий →</button>` : ''}
  </div>
  <div id="result"></div>`;
  
  content.innerHTML = html;
}

function renderFillTest(test) {
  let html = '';
  test.questions.forEach((q, i) => {
    const key = `${test.id}_${i}`;
    const saved = state.answers[key] || [];
    html += `<div class="question" id="q_${i}">
      <div class="question-text"><b>${i+1}.</b> ${q.text}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">`;
    q.answers.forEach((_, j) => {
      html += `<input type="text" data-q="${i}" data-a="${j}" 
        value="${saved[j] || ''}" placeholder="ответ ${j+1}" 
        onchange="saveAnswer(${test.id}, ${i}, ${j}, this.value)">`;
    });
    html += `</div><div class="feedback" id="fb_${i}"></div></div>`;
  });
  return html;
}

function renderMcqTest(test) {
  let html = '';
  test.questions.forEach((q, i) => {
    const key = `${test.id}_${i}`;
    const saved = state.answers[key];
    html += `<div class="question" id="q_${i}">
      <div class="question-text"><b>${i+1}.</b> ${q.text}</div>
      <div class="options">`;
    q.options.forEach((opt, j) => {
      const checked = saved === j ? 'checked' : '';
      html += `<label class="option" id="opt_${i}_${j}">
        <input type="radio" name="q_${i}" value="${j}" ${checked}
          onchange="saveAnswer(${test.id}, ${i}, null, ${j})">
        <span>${String.fromCharCode(65+j)}) ${opt}</span>
      </label>`;
    });
    html += `</div><div class="feedback" id="fb_${i}"></div></div>`;
  });
  return html;
}

function renderTransformTest(test) {
  let html = '';
  test.questions.forEach((q, i) => {
    const key = `${test.id}_${i}`;
    const saved = state.answers[key] || '';
    html += `<div class="question" id="q_${i}">
      <div class="question-text"><b>${i+1}.</b> ${q.original}</div>
      <div class="question-text">Ключевое слово: <span class="keyword">${q.keyword}</span></div>
      <div class="question-text">${q.target.replace('___', `<input type="text" class="transform-input" style="display:inline;width:300px;" data-q="${i}" value="${saved}" onchange="saveAnswer(${test.id}, ${i}, null, this.value)">`)}</div>
      <div class="feedback" id="fb_${i}"></div>
    </div>`;
  });
  return html;
}

function renderErrorTest(test) {
  let html = '';
  test.lines.forEach((line, i) => {
    const key = `${test.id}_${i}`;
    const saved = state.answers[key] || '';
    html += `<div class="error-line" id="q_${i}">
      <b>${i+1}.</b> ${line.text}
      <input type="text" data-q="${i}" value="${saved}" 
        placeholder="✓ или лишнее слово"
        onchange="saveAnswer(${test.id}, ${i}, null, this.value)">
      <div class="feedback" id="fb_${i}" style="margin-top:5px;"></div>
    </div>`;
  });
  return html;
}

function renderWordBuildTest(test) {
  let html = '';
  test.questions.forEach((q, i) => {
    const key = `${test.id}_${i}`;
    const saved = state.answers[key] || '';
    html += `<div class="question" id="q_${i}">
      <div class="word-building">
        <b>${i+1}.</b>
        <span>${q.text}</span>
        <span class="base-word">${q.base}</span>
        <input type="text" data-q="${i}" value="${saved}" 
          onchange="saveAnswer(${test.id}, ${i}, null, this.value)">
      </div>
      <div class="feedback" id="fb_${i}"></div>
    </div>`;
  });
  return html;
}

// ============ ЛОГИКА ============
function saveAnswer(testId, qIndex, aIndex, value) {
  const key = `${testId}_${qIndex}`;
  const test = getCurrentTest();
  if (test.type === 'fill' && aIndex !== null) {
    if (!state.answers[key]) state.answers[key] = [];
    state.answers[key][aIndex] = value;
  } else {
    state.answers[key] = value;
  }
}

function getCurrentTest() {
  return sections[state.currentSection].tests[state.currentTest];
}

function normalize(str) {
  return str.toLowerCase().trim().replace(/\s+/g, ' ').replace(/[.,!?]/g, '');
}

function checkAnswers() {
  const test = getCurrentTest();
  let correct = 0;
  let total = 0;
  
  if (test.type === 'fill') {
    test.questions.forEach((q, i) => {
      const key = `${test.id}_${i}`;
      const saved = state.answers[key] || [];
      let qCorrect = true;
      q.answers.forEach((ans, j) => {
        total++;
        const userAns = normalize(saved[j] || '');
        const correctAns = normalize(ans);
        if (userAns !== correctAns) qCorrect = false;
      });
      const fb = document.getElementById(`fb_${i}`);
      if (qCorrect) {
        correct++;
        fb.className = 'feedback show correct';
        fb.textContent = '✓ Правильно!';
      } else {
        fb.className = 'feedback show wrong';
        fb.textContent = `✗ Правильный ответ: ${q.answers.join(', ')}`;
      }
    });
  } else if (test.type === 'mcq') {
    test.questions.forEach((q, i) => {
      const key = `${test.id}_${i}`;
      const saved = state.answers[key];
      total++;
      const fb = document.getElementById(`fb_${i}`);
      if (saved === q.correct) {
        correct++;
        fb.className = 'feedback show correct';
        fb.textContent = '✓ Правильно!';
        document.getElementById(`opt_${i}_${saved}`).classList.add('correct');
      } else {
        fb.className = 'feedback show wrong';
        fb.textContent = ` Правильный ответ: ${String.fromCharCode(65+q.correct)}) ${q.options[q.correct]}`;
        if (saved !== undefined) {
          document.getElementById(`opt_${i}_${saved}`).classList.add('wrong');
        }
        document.getElementById(`opt_${i}_${q.correct}`).classList.add('correct');
      }
    });
  } else if (test.type === 'transform') {
    test.questions.forEach((q, i) => {
      const key = `${test.id}_${i}`;
      const saved = normalize(state.answers[key] || '');
      total++;
      const fb = document.getElementById(`fb_${i}`);
      const correctAns = q.answers.map(a => normalize(a));
      if (correctAns.includes(saved)) {
        correct++;
        fb.className = 'feedback show correct';
        fb.textContent = '✓ Правильно!';
      } else {
        fb.className = 'feedback show wrong';
        fb.textContent = `✗ Правильный ответ: ${q.answers[0]}`;
      }
    });
  } else if (test.type === 'error') {
    test.lines.forEach((line, i) => {
      const key = `${test.id}_${i}`;
      const saved = normalize(state.answers[key] || '');
      total++;
      const fb = document.getElementById(`fb_${i}`);
      if (line.correct) {
        if (saved === '✓' || saved === 'v' || saved === 'правильно' || saved === 'correct') {
          correct++;
          fb.className = 'feedback show correct';
          fb.textContent = '✓ Верно, строка правильная';
        } else {
          fb.className = 'feedback show wrong';
          fb.textContent = `✗ Строка правильная (✓)`;
        }
      } else {
        if (saved === normalize(line.extra)) {
          correct++;
          fb.className = 'feedback show correct';
          fb.textContent = `✓ Верно! Лишнее слово: "${line.extra}"`;
        } else {
          fb.className = 'feedback show wrong';
          fb.textContent = `✗ Лишнее слово: "${line.extra}"`;
        }
      }
    });
  } else if (test.type === 'wordbuild') {
    test.questions.forEach((q, i) => {
      const key = `${test.id}_${i}`;
      const saved = normalize(state.answers[key] || '');
      total++;
      const fb = document.getElementById(`fb_${i}`);
      const correctAns = q.answers.map(a => normalize(a));
      if (correctAns.includes(saved)) {
        correct++;
        fb.className = 'feedback show correct';
        fb.textContent = '✓ Правильно!';
      } else {
        fb.className = 'feedback show wrong';
        fb.textContent = `✗ Правильный ответ: ${q.answers[0]}`;
      }
    });
  }
  
  state.score += correct;
  state.totalAnswered += total;
  state.totalCorrect += correct;
  
  const pct = Math.round((correct / total) * 100);
  document.getElementById('result').innerHTML = `
    <div class="result-panel">
      <h3>Результат теста</h3>
      <div class="score-circle">${correct}/${total}</div>
      <p>Правильных ответов: <b>${correct}</b> из <b>${total}</b> (${pct}%)</p>
      <p style="margin-top:10px;opacity:0.9;">Общий счёт: ${state.score} очков</p>
    </div>
  `;
  
  updateStats();
}

function resetTest() {
  const test = getCurrentTest();
  test.questions?.forEach((_, i) => {
    const key = `${test.id}_${i}`;
    delete state.answers[key];
  });
  if (test.lines) {
    test.lines.forEach((_, i) => {
      delete state.answers[`${test.id}_${i}`];
    });
  }
  renderContent();
}

function nextTest() {
  const section = sections[state.currentSection];
  if (state.currentTest < section.tests.length - 1) {
    state.currentTest++;
    renderAll();
  }
}

function prevTest() {
  if (state.currentTest > 0) {
    state.currentTest--;
    renderAll();
  }
}

function updateStats() {
  const section = sections[state.currentSection];
  const test = getCurrentTest();
  document.getElementById('statSection').textContent = `${state.currentSection + 1}/10`;
  document.getElementById('statTest').textContent = `${test.id}/60`;
  document.getElementById('statScore').textContent = state.score;
  const accuracy = state.totalAnswered > 0 
    ? Math.round((state.totalCorrect / state.totalAnswered) * 100) 
    : 0;
  document.getElementById('statAccuracy').textContent = `${accuracy}%`;
}

function renderAll() {
  renderNav();
  renderContent();
  updateStats();
}

// Запуск
renderAll();
</script>
