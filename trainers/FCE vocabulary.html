<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Test Your Vocabulary for FCE - Interactive Trainer</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  body {
    font-family: 'Segoe UI', Tahoma, sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }
  
  .container {
    max-width: 1200px;
    margin: 0 auto;
    background: #fff;
    border-radius: 16px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    overflow: hidden;
  }
  
  header {
    background: linear-gradient(135deg, #2c3e50, #4a6572);
    color: #fff;
    padding: 25px 30px;
    text-align: center;
  }
  
  header h1 { font-size: 28px; margin-bottom: 6px; }
  header p { opacity: 0.85; font-size: 14px; }
  
  .stats-bar {
    display: flex;
    justify-content: space-around;
    background: #f8f9fa;
    padding: 12px;
    border-bottom: 2px solid #e9ecef;
    flex-wrap: wrap;
    gap: 10px;
  }
  
  .stat {
    text-align: center;
    min-width: 100px;
  }
  
  .stat-value {
    font-size: 22px;
    font-weight: bold;
    color: #667eea;
  }
  
  .stat-label {
    font-size: 11px;
    color: #6c757d;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  
  .nav {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 15px;
    background: #f1f3f5;
    border-bottom: 1px solid #dee2e6;
    max-height: 300px;
    overflow-y: auto;
  }
  
  .nav button {
    flex: 1;
    min-width: 140px;
    padding: 10px 14px;
    border: none;
    background: #fff;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    font-weight: 600;
    color: #495057;
    transition: all 0.2s;
    border: 2px solid transparent;
  }
  
  .nav button:hover { background: #e9ecef; }
  .nav button.active {
    background: #667eea;
    color: #fff;
    box-shadow: 0 4px 12px rgba(102,126,234,0.4);
  }
  
  .content {
    padding: 30px;
    min-height: 500px;
  }
  
  .test-header {
    margin-bottom: 20px;
    padding-bottom: 15px;
    border-bottom: 2px solid #e9ecef;
  }
  
  .test-header h2 {
    color: #2c3e50;
    margin-bottom: 8px;
  }
  
  .test-header p {
    color: #6c757d;
    font-style: italic;
    font-size: 14px;
  }
  
  .question {
    background: #f8f9fa;
    border-left: 4px solid #667eea;
    padding: 15px 20px;
    margin-bottom: 15px;
    border-radius: 0 8px 8px 0;
  }
  
  .question-text {
    margin-bottom: 10px;
    line-height: 1.6;
    font-size: 15px;
  }
  
  .question input[type="text"] {
    padding: 8px 12px;
    border: 2px solid #ced4da;
    border-radius: 6px;
    font-size: 14px;
    width: 200px;
    transition: border-color 0.2s;
  }
  
  .question input[type="text"]:focus {
    outline: none;
    border-color: #667eea;
  }
  
  .options {
    display: flex;
    flex-direction: column;
    gap: 8px;
    margin-top: 10px;
  }
  
  .option {
    display: flex;
    align-items: center;
    padding: 10px 14px;
    background: #fff;
    border: 2px solid #dee2e6;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .option:hover { border-color: #667eea; background: #f0f3ff; }
  .option input { margin-right: 10px; }
  .option.correct {
    background: #d4edda;
    border-color: #28a745;
  }
  .option.wrong {
    background: #f8d7da;
    border-color: #dc3545;
  }
  
  .feedback {
    margin-top: 10px;
    padding: 8px 12px;
    border-radius: 6px;
    font-size: 13px;
    display: none;
  }
  
  .feedback.show { display: block; }
  .feedback.correct { background: #d4edda; color: #155724; }
  .feedback.wrong { background: #f8d7da; color: #721c24; }
  
  .controls {
    display: flex;
    gap: 10px;
    margin-top: 25px;
    flex-wrap: wrap;
  }
  
  .btn {
    padding: 12px 24px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    font-size: 14px;
    font-weight: 600;
    transition: all 0.2s;
  }
  
  .btn-primary {
    background: #667eea;
    color: #fff;
  }
  
  .btn-primary:hover { background: #5568d3; }
  .btn-secondary {
    background: #6c757d;
    color: #fff;
  }
  .btn-secondary:hover { background: #5a6268; }
  .btn-success {
    background: #28a745;
    color: #fff;
  }
  
  .result-panel {
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    padding: 30px;
    border-radius: 12px;
    text-align: center;
    margin-top: 20px;
  }
  
  .result-panel h3 { font-size: 24px; margin-bottom: 15px; }
  .score-circle {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: rgba(255,255,255,0.2);
    display: flex;
    align-items: center;
    justify-content: center;
    margin: 20px auto;
    font-size: 32px;
    font-weight: bold;
    border: 4px solid #fff;
  }
  
  .matching-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 15px;
    margin-top: 15px;
  }
  
  .matching-item {
    padding: 12px;
    background: #fff;
    border: 2px solid #dee2e6;
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .matching-item:hover { border-color: #667eea; }
  .matching-item.selected { background: #e7f3ff; border-color: #667eea; }
  .matching-item.matched { background: #d4edda; border-color: #28a745; }
  
  .word-list {
    display: flex;
    flex-wrap: wrap;
    gap: 10px;
    margin-top: 10px;
  }
  
  .word-tag {
    padding: 6px 12px;
    background: #e9ecef;
    border-radius: 20px;
    font-size: 13px;
    cursor: pointer;
    transition: all 0.2s;
  }
  
  .word-tag:hover { background: #667eea; color: #fff; }
  .word-tag.used { opacity: 0.4; pointer-events: none; }
  
  @media (max-width: 600px) {
    .content { padding: 15px; }
    header h1 { font-size: 22px; }
    .nav button { min-width: 100%; }
    .matching-grid { grid-template-columns: 1fr; }
  }
</style>

// State management
let state = {
  currentSection: 0,
  currentTest: 0,
  score: 0,
  totalAnswered: 0,
  totalCorrect: 0,
  answers: {}
};

// Rendering functions
function renderNav() {
  const nav = document.getElementById('nav');
  nav.innerHTML = '';
  sections.forEach((sec, i) => {
    sec.tests.forEach((test, j) => {
      const btn = document.createElement('button');
      btn.textContent = `Test ${test.id}: ${test.title}`;
      const globalTestIndex = sections.slice(0, i).reduce((sum, s) => sum + s.tests.length, 0) + j;
      btn.className = globalTestIndex === state.currentTest ? 'active' : '';
      btn.onclick = () => {
        state.currentSection = i;
        state.currentTest = globalTestIndex;
        renderAll();
      };
      nav.appendChild(btn);
    });
  });
}

function getCurrentTest() {
  let testIndex = 0;
  for (let i = 0; i < sections.length; i++) {
    for (let j = 0; j < sections[i].tests.length; j++) {
      if (testIndex === state.currentTest) {
        return sections[i].tests[j];
      }
      testIndex++;
    }
  }
  return sections[0].tests[0];
}

function renderContent() {
  const content = document.getElementById('content');
  const test = getCurrentTest();
  
  let html = `<div class="test-header">
    <h2>Test ${test.id}: ${test.title}</h2>
    <p>${test.instruction}</p>
  </div>`;
  
  if (test.type === 'fill') {
    html += renderFillTest(test);
  } else if (test.type === 'mcq') {
    html += renderMcqTest(test);
  }
  
  html += `<div class="controls">
    <button class="btn btn-primary" onclick="checkAnswers()">✓ Check Answers</button>
    <button class="btn btn-secondary" onclick="resetTest()">↺ Reset</button>
    ${state.currentTest > 0 ? `<button class="btn btn-secondary" onclick="prevTest()">← Previous</button>` : ''}
    ${state.currentTest < 59 ? `<button class="btn btn-success" onclick="nextTest()">Next →</button>` : ''}
  </div>
  <div id="result"></div>`;
  
  content.innerHTML = html;
}

function renderFillTest(test) {
  let html = '';
  test.questions.forEach((q, i) => {
    const key = `${test.id}_${i}`;
    const saved = state.answers[key] || [];
    html += `<div class="question" id="q_${i}">
      <div class="question-text"><b>${i+1}.</b> ${q.text}</div>
      <div style="display:flex;flex-wrap:wrap;gap:8px;">`;
    q.answers.forEach((_, j) => {
      html += `<input type="text" data-q="${i}" data-a="${j}" 
        value="${saved[j] || ''}" placeholder="answer ${j+1}" 
        onchange="saveAnswer(${test.id}, ${i}, ${j}, this.value)">`;
    });
    html += `</div><div class="feedback" id="fb_${i}"></div></div>`;
  });
  return html;
}

function renderMcqTest(test) {
  let html = '';
  test.questions.forEach((q, i) => {
    const key = `${test.id}_${i}`;
    const saved = state.answers[key];
    html += `<div class="question" id="q_${i}">
      <div class="question-text"><b>${i+1}.</b> ${q.text}</div>
      <div class="options">`;
    q.options.forEach((opt, j) => {
      const checked = saved === j ? 'checked' : '';
      html += `<label class="option" id="opt_${i}_${j}">
        <input type="radio" name="q_${i}" value="${j}" ${checked}
          onchange="saveAnswer(${test.id}, ${i}, null, ${j})">
        <span>${String.fromCharCode(65+j)}) ${opt}</span>
      </label>`;
    });
    html += `</div><div class="feedback" id="fb_${i}"></div></div>`;
  });
  return html;
}

// Logic functions
function saveAnswer(testId, qIndex, aIndex, value) {
  const key = `${testId}_${qIndex}`;
  const test = getCurrentTest();
  if (test.type === 'fill' && aIndex !== null) {
    if (!state.answers[key]) state.answers[key] = [];
    state.answers[key][aIndex] = value;
  } else {
    state.answers[key] = value;
  }
}

function normalize(str) {
  return str.toLowerCase().trim().replace(/\s+/g, ' ').replace(/[.,!?]/g, '');
}

function checkAnswers() {
  const test = getCurrentTest();
  let correct = 0;
  let total = 0;
  
  if (test.type === 'fill') {
    test.questions.forEach((q, i) => {
      const key = `${test.id}_${i}`;
      const saved = state.answers[key] || [];
      let qCorrect = true;
      q.answers.forEach((ans, j) => {
        total++;
        const userAns = normalize(saved[j] || '');
        const correctAns = normalize(ans);
        if (userAns !== correctAns) qCorrect = false;
      });
      const fb = document.getElementById(`fb_${i}`);
      if (qCorrect) {
        correct++;
        fb.className = 'feedback show correct';
        fb.textContent = '✓ Correct!';
      } else {
        fb.className = 'feedback show wrong';
        fb.textContent = `✗ Correct: ${q.answers.join(', ')}`;
      }
    });
  } else if (test.type === 'mcq') {
    test.questions.forEach((q, i) => {
      const key = `${test.id}_${i}`;
      const saved = state.answers[key];
      total++;
      const fb = document.getElementById(`fb_${i}`);
      if (saved === q.correct) {
        correct++;
        fb.className = 'feedback show correct';
        fb.textContent = '✓ Correct!';
        document.getElementById(`opt_${i}_${saved}`).classList.add('correct');
      } else {
        fb.className = 'feedback show wrong';
        fb.textContent = `✗ Correct: ${String.fromCharCode(65+q.correct)}) ${q.options[q.correct]}`;
        if (saved !== undefined) {
          document.getElementById(`opt_${i}_${saved}`).classList.add('wrong');
        }
        document.getElementById(`opt_${i}_${q.correct}`).classList.add('correct');
      }
    });
  }
  
  state.score += correct;
  state.totalAnswered += total;
  state.totalCorrect += correct;
  
  const pct = Math.round((correct / total) * 100);
  document.getElementById('result').innerHTML = `
    <div class="result-panel">
      <h3>Test Result</h3>
      <div class="score-circle">${correct}/${total}</div>
      <p>Correct: <b>${correct}</b> of <b>${total}</b> (${pct}%)</p>
      <p style="margin-top:10px;opacity:0.9;">Total score: ${state.score} points</p>
    </div>
  `;
  
  updateStats();
}

function resetTest() {
  const test = getCurrentTest();
  test.questions?.forEach((_, i) => {
    const key = `${test.id}_${i}`;
    delete state.answers[key];
  });
  renderContent();
}

function nextTest() {
  if (state.currentTest < 59) {
    state.currentTest++;
    renderAll();
  }
}

function prevTest() {
  if (state.currentTest > 0) {
    state.currentTest--;
    renderAll();
  }
}

function updateStats() {
  const sectionNum = state.currentTest < 20 ? 1 : state.currentTest < 50 ? 2 : 3;
  document.getElementById('statSection').textContent = `${sectionNum}/3`;
  document.getElementById('statTest').textContent = `${state.currentTest + 1}/60`;
  document.getElementById('statScore').textContent = state.score;
  const accuracy = state.totalAnswered > 0 
    ? Math.round((state.totalCorrect / state.totalAnswered) * 100) 
    : 0;
  document.getElementById('statAccuracy').textContent = `${accuracy}%`;
}

function renderAll() {
  renderNav();
  renderContent();
  updateStats();
}

// Initialize
renderAll();
</script>
</body>
</html>
