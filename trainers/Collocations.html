<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Translation & Quiz Challenge · English with Soul</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --lavender: #e8dff5;
            --peach: #fce4d6;
            --mint: #d4f1e8;
            --rose: #f7d6e0;
            --cream: #fdf6f0;
            --deep: #5a4a7a;
            --soft: #8b7ba8;
            --text: #3d3554;
            --text-light: #8b7ba8;
            --success: #6ba889;
            --danger: #c97b84;
            --warning: #d4a574;
            --shadow: 0 10px 40px rgba(138,107,175,0.15);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, var(--cream) 0%, var(--lavender) 50%, var(--peach) 100%);
            background-attachment: fixed;
            min-height: 100vh;
            padding: 20px;
            color: var(--text);
            overflow-x: hidden;
        }

        .blob {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.4;
            z-index: -1;
            animation: float 20s infinite ease-in-out;
        }
        .blob1 { width: 400px; height: 400px; background: var(--rose); top: -100px; left: -100px; }
        .blob2 { width: 500px; height: 500px; background: var(--mint); bottom: -150px; right: -150px; animation-delay: -10s; }
        .blob3 { width: 300px; height: 300px; background: var(--lavender); top: 50%; left: 50%; animation-delay: -5s; }

        @keyframes float {
            0%,100% { transform: translate(0,0) scale(1); }
            33% { transform: translate(50px,-50px) scale(1.1); }
            66% { transform: translate(-30px,40px) scale(0.95); }
        }

        .top-nav {
            max-width: 800px;
            margin: 0 auto 25px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 25px;
            background: rgba(253,246,240,0.7);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-radius: 40px;
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: var(--shadow);
        }

        .logo {
            font-family: 'Cormorant Garamond', serif;
            font-size: 22px;
            font-weight: 600;
            color: var(--deep);
            letter-spacing: 1px;
        }
        .logo span { color: var(--soft); font-style: italic; }

        .back-btn {
            padding: 10px 22px;
            background: linear-gradient(135deg, var(--deep), var(--soft));
            color: white;
            text-decoration: none;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 500;
            box-shadow: 0 6px 20px rgba(90,74,122,0.25);
            transition: all 0.3s;
        }
        .back-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(90,74,122,0.35);
        }

        .container { max-width: 800px; margin: 0 auto; }

        header {
            text-align: center;
            margin-bottom: 30px;
            padding: 30px 20px;
            background: rgba(255,255,255,0.5);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 30px;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: var(--shadow);
        }

        header h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2.8em;
            font-weight: 500;
            color: var(--deep);
            margin-bottom: 10px;
            letter-spacing: 0.5px;
        }

        header p { color: var(--soft); font-size: 1.05em; font-style: italic; }

        .stats {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .stat-box {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 16px 24px;
            border-radius: 20px;
            border: 1px solid rgba(255,255,255,0.8);
            box-shadow: var(--shadow);
            min-width: 120px;
            text-align: center;
            transition: all 0.3s;
        }
        .stat-box:hover {
            transform: translateY(-3px);
            box-shadow: 0 15px 40px rgba(138,107,175,0.25);
        }

        .stat-label {
            font-size: 0.75em;
            color: var(--text-light);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 4px;
        }

        .stat-value {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8em;
            font-weight: 600;
            color: var(--deep);
        }

        .card {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 30px;
            padding: 40px;
            box-shadow: var(--shadow);
            margin-bottom: 20px;
            transition: all 0.4s;
            animation: slideUp 0.6s ease;
        }
        .card:hover {
            transform: translateY(-4px);
            box-shadow: 0 20px 50px rgba(138,107,175,0.25);
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(30px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .question-text {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.8em;
            font-weight: 500;
            color: var(--deep);
            margin-bottom: 12px;
            line-height: 1.4;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .hint {
            color: var(--text-light);
            font-size: 0.95em;
            margin-bottom: 25px;
            font-style: italic;
            padding: 12px 18px;
            background: rgba(232,223,245,0.3);
            border-left: 3px solid var(--soft);
            border-radius: 10px;
        }

        .input-area { margin-bottom: 25px; }

        input[type="text"] {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.05em;
            font-family: 'Montserrat', sans-serif;
            border: 2px solid var(--lavender);
            border-radius: 18px;
            background: rgba(255,255,255,0.8);
            color: var(--text);
            transition: all 0.3s;
        }
        input[type="text"]:focus {
            outline: none;
            border-color: var(--soft);
            box-shadow: 0 0 0 4px rgba(139,123,168,0.15);
        }
        input[type="text"].correct {
            border-color: var(--success);
            background: rgba(212,241,232,0.4);
            color: var(--success);
            font-weight: 500;
        }
        input[type="text"].incorrect {
            border-color: var(--danger);
            background: rgba(247,214,224,0.4);
            color: var(--danger);
            font-weight: 500;
        }

        .buttons { display: flex; gap: 10px; flex-wrap: wrap; }

        button {
            padding: 12px 24px;
            font-size: 0.95em;
            font-family: 'Montserrat', sans-serif;
            font-weight: 500;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s;
            letter-spacing: 0.3px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--deep), var(--soft));
            color: white;
            box-shadow: 0 6px 18px rgba(90,74,122,0.25);
        }
        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(90,74,122,0.35);
        }

        .btn-secondary {
            background: rgba(255,255,255,0.7);
            color: var(--deep);
            border: 1px solid var(--lavender);
        }
        .btn-secondary:hover {
            background: linear-gradient(135deg, var(--lavender), var(--rose));
            transform: translateY(-2px);
        }

        .btn-speak {
            background: linear-gradient(135deg, var(--peach), var(--rose));
            color: var(--deep);
            padding: 8px 16px;
            font-size: 0.9em;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.3s;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .btn-speak:hover {
            transform: scale(1.05);
            box-shadow: 0 4px 15px rgba(212,165,116,0.3);
        }
        .btn-speak.speaking {
            background: linear-gradient(135deg, var(--success), var(--mint));
            animation: pulse 1s infinite;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.05); }
        }

        .feedback {
            margin-top: 25px;
            padding: 20px;
            border-radius: 18px;
            display: none;
            animation: fadeIn 0.4s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .feedback.correct {
            display: block;
            background: rgba(212,241,232,0.6);
            border-left: 4px solid var(--success);
            color: #2d6a5a;
        }

        .feedback.incorrect {
            display: block;
            background: rgba(247,214,224,0.6);
            border-left: 4px solid var(--danger);
            color: #8b3a4a;
        }

        .correct-answer {
            font-family: 'Cormorant Garamond', serif;
            font-weight: 600;
            font-size: 1.3em;
            margin-top: 10px;
            color: var(--deep);
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .progress-bar {
            width: 100%;
            height: 8px;
            background: rgba(232,223,245,0.5);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 25px;
        }

        .progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--success), var(--soft), var(--deep));
            transition: width 0.5s;
            border-radius: 4px;
        }

        .controls-row {
            display: flex;
            gap: 15px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        .controls-row select {
            flex: 1;
            min-width: 200px;
            padding: 14px 18px;
            font-size: 1em;
            font-family: 'Montserrat', sans-serif;
            border: 2px solid var(--lavender);
            border-radius: 18px;
            background: rgba(255,255,255,0.8);
            color: var(--text);
            cursor: pointer;
            transition: all 0.3s;
        }
        .controls-row select:focus { outline: none; border-color: var(--soft); }

        .bottom-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            margin-top: 20px;
        }

        .vocabulary-table-container {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 30px;
            padding: 30px;
            box-shadow: var(--shadow);
            margin-top: 20px;
            display: none;
            animation: slideUp 0.6s ease;
            max-height: 600px;
            overflow-y: auto;
        }

        .vocabulary-table-container.active { display: block; }

        .search-box {
            margin-bottom: 20px;
            position: relative;
        }

        .search-box input {
            width: 100%;
            padding: 14px 18px 14px 45px;
            font-size: 1em;
            font-family: 'Montserrat', sans-serif;
            border: 2px solid var(--lavender);
            border-radius: 18px;
            background: rgba(255,255,255,0.8);
            color: var(--text);
            transition: all 0.3s;
        }
        .search-box input:focus {
            outline: none;
            border-color: var(--soft);
            box-shadow: 0 0 0 4px rgba(139,123,168,0.15);
        }
        .search-box::before {
            content: "🔍";
            position: absolute;
            left: 16px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 1.1em;
            opacity: 0.6;
        }

        .vocabulary-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0;
            font-size: 0.9em;
        }

        .vocabulary-table thead {
            background: linear-gradient(135deg, var(--deep), var(--soft));
            color: white;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .vocabulary-table th {
            padding: 15px 12px;
            text-align: left;
            font-weight: 600;
            font-size: 0.85em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .vocabulary-table th:first-child { border-radius: 15px 0 0 0; }
        .vocabulary-table th:last-child { border-radius: 0 15px 0 0; }

        .vocabulary-table tbody tr {
            background: rgba(255,255,255,0.6);
            transition: all 0.3s;
        }

        .vocabulary-table tbody tr:hover {
            background: rgba(232,223,245,0.3);
            transform: scale(1.01);
        }

        .vocabulary-table td {
            padding: 12px;
            border-bottom: 1px solid rgba(232,223,245,0.3);
            vertical-align: top;
        }

        .vocabulary-table tbody tr:last-child td:first-child { border-radius: 0 0 0 15px; }
        .vocabulary-table tbody tr:last-child td:last-child { border-radius: 0 0 15px 0; }

        .vocabulary-table .ru-word {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.1em;
            font-weight: 600;
            color: var(--deep);
        }

        .vocabulary-table .en-word {
            color: var(--success);
            font-weight: 500;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .vocabulary-table .category-badge {
            display: inline-block;
            padding: 4px 10px;
            background: var(--lavender);
            color: var(--deep);
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 500;
        }

        .vocabulary-table .hint-text {
            color: var(--text-light);
            font-size: 0.9em;
            font-style: italic;
        }

        .toggle-table-btn {
            background: linear-gradient(135deg, var(--mint), var(--lavender));
            color: var(--deep);
            font-weight: 600;
            padding: 14px 28px;
            box-shadow: 0 6px 20px rgba(212,241,232,0.3);
        }

        .toggle-table-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(212,241,232,0.4);
        }

        /* Quiz Styles */
        .quiz-options {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-bottom: 25px;
        }

        .quiz-option {
            padding: 16px 20px;
            background: rgba(255,255,255,0.6);
            border: 2px solid var(--lavender);
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 1.05em;
        }

        .quiz-option:hover {
            background: rgba(232,223,245,0.5);
            border-color: var(--soft);
        }

        .quiz-option input[type="radio"] {
            accent-color: var(--deep);
            transform: scale(1.3);
            cursor: pointer;
        }

        .quiz-option.selected {
            border-color: var(--deep);
            background: rgba(232,223,245,0.4);
        }

        .quiz-option.correct-opt {
            border-color: var(--success);
            background: rgba(212,241,232,0.5);
        }

        .quiz-option.incorrect-opt {
            border-color: var(--danger);
            background: rgba(247,214,224,0.5);
        }

        /* Settings Panel */
        .settings-panel {
            background: rgba(255,255,255,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid rgba(255,255,255,0.8);
            border-radius: 20px;
            padding: 20px;
            margin-bottom: 25px;
            display: none;
        }

        .settings-panel.active {
            display: block;
            animation: slideUp 0.4s ease;
        }

        .settings-row {
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 15px;
            flex-wrap: wrap;
        }

        .settings-row:last-child {
            margin-bottom: 0;
        }

        .settings-row label {
            font-size: 0.9em;
            color: var(--text);
            min-width: 150px;
        }

        .settings-row input[type="range"] {
            flex: 1;
            min-width: 150px;
        }

        .settings-row select {
            flex: 1;
            min-width: 200px;
            padding: 10px 15px;
            font-size: 0.9em;
            font-family: 'Montserrat', sans-serif;
            border: 2px solid var(--lavender);
            border-radius: 15px;
            background: rgba(255,255,255,0.8);
            color: var(--text);
            cursor: pointer;
        }

        .settings-row input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: var(--deep);
            cursor: pointer;
        }

        .settings-toggle {
            background: linear-gradient(135deg, var(--warning), var(--peach));
            color: var(--deep);
            font-weight: 500;
            padding: 10px 20px;
            font-size: 0.9em;
        }

        .speed-value {
            font-weight: 600;
            color: var(--deep);
            min-width: 40px;
            text-align: center;
        }

        @media (max-width: 600px) {
            header h1 { font-size: 2em; }
            .card { padding: 25px; }
            .question-text { font-size: 1.4em; }
            .top-nav { padding: 12px 18px; }
            .logo { font-size: 18px; }
            .stat-box { padding: 12px 18px; min-width: 90px; }
            .stat-value { font-size: 1.4em; }
            .vocabulary-table { font-size: 0.8em; }
            .vocabulary-table th, .vocabulary-table td { padding: 8px 6px; }
        }
    </style>
</head>
<body>

<div class="blob blob1"></div>
<div class="blob blob2"></div>
<div class="blob blob3"></div>

<div class="top-nav">
    <div class="logo">Natalie <span>English</span></div>
    <a href="../index.html" class="back-btn">← На главную</a>
</div>

<div class="container">
    <header>
        <h1> Collocations Challenge</h1>
        <p>Перевод и тесты по 50 урокам (1000+ коллокаций)</p>
    </header>

    <div class="stats">
        <div class="stat-box">
            <div class="stat-label">Правильно</div>
            <div class="stat-value" id="correctCount">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Неправильно</div>
            <div class="stat-value" id="incorrectCount">0</div>
        </div>
        <div class="stat-box">
            <div class="stat-label">Всего</div>
            <div class="stat-value" id="totalCount">0</div>
        </div>
    </div>

    <div class="progress-bar">
        <div class="progress-fill" id="progressBar" style="width: 0%"></div>
    </div>

    <div class="card">
        <div class="controls-row">
            <select id="modeSelect">
                <option value="translation">Режим: Перевод (ввод)</option>
                <option value="quiz">Режим: Тест (выбор)</option>
            </select>
            <select id="categorySelect">
                <option value="all">Все темы (50 уроков)</option>
                <option value="family">1. Family (Семья)</option>
                <option value="relationships">2. Relationships (Отношения)</option>
                <option value="appearance">3. Appearance (Внешность)</option>
                <option value="character">4. Character & Behavior</option>
                <option value="feelings">5. Feelings (Чувства)</option>
                <option value="housing">6. Houses & Apartments</option>
                <option value="food">7. Eating & Food</option>
                <option value="entertainment">8. Movies & Books</option>
                <option value="music">9. Music</option>
                <option value="sports">10. Sports</option>
                <option value="health">11. Health & Sickness</option>
                <option value="computers">12. Computers</option>
                <option value="study">13. Study & Education</option>
                <option value="academic">14. Academic English</option>
                <option value="work">15. Work</option>
                <option value="business">16. Business</option>
                <option value="money">17. Money</option>
                <option value="travel">18. Travel</option>
                <option value="weather">19. Weather</option>
                <option value="city">20. City</option>
                <option value="countryside">21. Countryside</option>
                <option value="crime">22. Crime</option>
                <option value="law">23. Law & Justice</option>
                <option value="war">24. War & Peace</option>
                <option value="environment">25. Global Problems</option>
                <option value="time">26. Time</option>
                <option value="sound">27. Sound</option>
                <option value="size">28. Size</option>
                <option value="light">29. Light</option>
                <option value="color">30. Color</option>
                <option value="texture">31. Texture</option>
                <option value="smell">32. Smell</option>
                <option value="taste">33. Taste</option>
                <option value="statistics">34. Statistics</option>
                <option value="movement">35. Movement & Speed</option>
                <option value="changes">36. Changes</option>
                <option value="speaking">37. Speaking</option>
                <option value="starting">38. Starting & Finishing</option>
                <option value="success">39. Success & Failure</option>
                <option value="cause">40. Cause & Effect</option>
                <option value="memories">41. Memories</option>
                <option value="agreeing">42. Agreeing & Disagreeing</option>
                <option value="beliefs">43. Beliefs & Doubts</option>
                <option value="deciding">44. Deciding & Choosing</option>
                <option value="claiming">45. Claiming & Denying</option>
                <option value="liking">46. Liking & Disliking</option>
                <option value="praising">47. Praising & Criticizing</option>
                <option value="metaphor">48. Metaphor</option>
                <option value="confusing">49. Confusing Words</option>
                <option value="everyday">50. Everyday Verbs</option>
            </select>
            <button class="settings-toggle" onclick="toggleSettings()">️ Настройки озвучки</button>
        </div>

        <div class="settings-panel" id="settingsPanel">
            <div class="settings-row">
                <label>🔊 Скорость речи:</label>
                <input type="range" id="speechRate" min="0.5" max="1.5" step="0.1" value="0.9">
                <span class="speed-value" id="speedValue">0.9x</span>
            </div>
            <div class="settings-row">
                <label>🎙️ Голос:</label>
                <select id="voiceSelect"></select>
            </div>
            <div class="settings-row">
                <label>🔁 Автоозвучка:</label>
                <input type="checkbox" id="autoSpeak" checked>
                <span style="font-size: 0.9em; color: var(--text-light);">Озвучивать правильный ответ автоматически</span>

        { question: "As the concert drew to a ______, the lead singer thanked the fans.", ru: "По мере того как концерт ______ (подходил к концу), ведущий певец поблагодарил фанатов.", options: ["close", "end", "finish"], correctIndex: 0, category: "starting", hint: "Урок 38" },
        { question: "Edward certainly ______ my respect when he turned down an unethical business deal.", ru: "Эдвард определенно ______ (завоевал) мое уважение, когда отказался от неэтичной сделки.", options: ["bet", "took", "won"], correctIndex: 2, category: "success", hint: "Урок 39" },
        { question: "An earthquake has caused extensive ______ in the countryside.", ru: "Землетрясение причинило обширный ______ (ущерб) в сельской местности.", options: ["damage", "defects", "uproar"], correctIndex: 0, category: "cause", hint: "Урок 40" },
        { question: "Did you put my jacket somewhere? I ______ remember leaving it here.", ru: "Ты не видел мою куртку? Я ______ (отчетливо) помню, что оставлял ее здесь.", options: ["blank", "distinctly", "vaguely"], correctIndex: 1, category: "memories", hint: "Урок 41" },
        { question: "I agree in ______ that we need to spend less time on our iPhones.", ru: "Я согласен в ______ (принципе), что нам нужно меньше времени проводить в iPhone.", options: ["basis", "foundation", "principle"], correctIndex: 2, category: "agreeing", hint: "Урок 42" },
        { question: "Aaron seems to have an ______ belief in his own superiority.", ru: "Кажется, у Аарона есть ______ (нерушимая) вера в собственное превосходство.", options: ["unfeasible", "unlikeable", "unshakable"], correctIndex: 2, category: "beliefs", hint: "Урок 43" },
        { question: "I was ______ 12 different universities.", ru: "Я ______ (рассматривал) 12 разных университетов.", options: ["considering", "discussing", "weighing"], correctIndex: 0, category: "deciding", hint: "Урок 44" },
        { question: "A ______ document shows that the U.S. is planning to build additional military bases.", ru: "______ (Утекший) документ показывает, что США планируют построить дополнительные военные базы.", options: ["disclosed", "escaped", "leaked"], correctIndex: 2, category: "claiming", hint: "Урок 45" },
        { question: "Brian ______ an instant dislike to his father's new girlfriend.", ru: "Брайан ______ (мгновенно возненавидел) новую девушку своего отца.", options: ["caught", "got", "took"], correctIndex: 2, category: "liking", hint: "Урок 46" },
        { question: "Her parents refused to give their ______ to her marriage.", ru: "Ее родители отказались дать свое ______ (благословение) на ее брак.", options: ["blessing", "grace", "thanksgiving"], correctIndex: 0, category: "praising", hint: "Урок 47" },
        { question: "A new TV show has sparked ______ by showing the positive side of dropping out.", ru: "Новое телешоу ______ (вызвало споры), показав положительную сторону отчисления из школы.", options: ["argument", "contention", "controversy"], correctIndex: 2, category: "metaphor", hint: "Урок 48" },
        { question: "As the movie drew to a ______, there were some surprising twists.", ru: "По мере того как фильм ______ (подходил к концу), произошли некоторые неожиданные повороты.", options: ["close", "end", "finish"], correctIndex: 0, category: "confusing", hint: "Урок 49" },
        { question: "Are you ______ married in a church?", ru: "Ты ______ (женишься/выходишь замуж) в церкви?", options: ["getting", "having", "taking"], correctIndex: 0, category: "everyday", hint: "Урок 50" }
    ];

    let currentQuestion = 0;
    let correctCount = 0;
    let incorrectCount = 0;
    let currentMode = 'translation';
    let shuffledQuestions = [...questions];
    let shuffledQuiz = [...quizQuestions];
    let voices = [];
    let currentUtterance = null;

    // === ИНИЦИАЛИЗАЦИЯ ОЗВУЧКИ ===
    function initSpeech() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = function() {
                voices = window.speechSynthesis.getVoices();
                populateVoiceSelect();
            };
            voices = window.speechSynthesis.getVoices();
            populateVoiceSelect();
        }
    }

    function populateVoiceSelect() {
        const voiceSelect = document.getElementById('voiceSelect');
        voiceSelect.innerHTML = '';
        
        // Фильтруем только английские голоса
        const englishVoices = voices.filter(v => v.lang.startsWith('en'));
        
        englishVoices.forEach((voice, index) => {
            const option = document.createElement('option');
            option.value = voices.indexOf(voice);
            option.textContent = `${voice.name} (${voice.lang})`;
            voiceSelect.appendChild(option);
        });

        // Выбираем первый английский голос по умолчанию
        if (englishVoices.length > 0) {
            voiceSelect.value = voices.indexOf(englishVoices[0]);
        }
    }

    function speak(text, button = null) {
        if (!('speechSynthesis' in window)) {
            alert('Ваш браузер не поддерживает озвучку. Попробуйте Chrome, Firefox или Edge.');
            return;
        }

        // Отменяем предыдущую озвучку
        window.speechSynthesis.cancel();

        const utterance = new SpeechSynthesisUtterance(text);
        const voiceIndex = document.getElementById('voiceSelect').value;
        const rate = parseFloat(document.getElementById('speechRate').value);

        if (voices[voiceIndex]) {
            utterance.voice = voices[voiceIndex];
        }
        utterance.rate = rate;
        utterance.lang = 'en-US';

        if (button) {
            button.classList.add('speaking');
            utterance.onend = () => button.classList.remove('speaking');
            utterance.onerror = () => button.classList.remove('speaking');
        }

        currentUtterance = utterance;
        window.speechSynthesis.speak(utterance);
    }

    function stopSpeaking() {
        if ('speechSynthesis' in window) {
            window.speechSynthesis.cancel();
        }
    }

    function toggleSettings() {
        const panel = document.getElementById('settingsPanel');
        panel.classList.toggle('active');
    }

    document.getElementById('speechRate').addEventListener('input', function(e) {
        document.getElementById('speedValue').textContent = e.target.value + 'x';
    });

    // === ОСНОВНОЙ КОД ===
    function init() {
        shuffleArray(shuffledQuestions);
        shuffleArray(shuffledQuiz);
        loadQuestion();
        updateStats();
        populateVocabularyTable();
        initSpeech();
    }

    function shuffleArray(array) {
        for (let i = array.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [array[i], array[j]] = [array[j], array[i]];
        }
    }

    function getActiveArray() {
        return currentMode === 'translation' ? shuffledQuestions : shuffledQuiz;
    }

    function filterQuestions() {
        const category = document.getElementById('categorySelect').value;
        const arr = getActiveArray();
        if (category === 'all') return arr;
        return arr.filter(q => q.category === category);
    }

    function loadQuestion() {
        const filtered = filterQuestions();
        if (filtered.length === 0) {
            document.getElementById('questionText').textContent = "Нет вопросов в этой категории";
            return;
        }
        const q = filtered[currentQuestion % filtered.length];
        const inputArea = document.getElementById('inputArea');
        const quizArea = document.getElementById('quizArea');

        if (currentMode === 'translation') {
            document.getElementById('questionText').innerHTML = `${q.ru} <button class="btn-speak" onclick="speak('${q.en[0]}', this)">🔊</button>`;
            inputArea.style.display = 'block';
            quizArea.style.display = 'none';
            document.getElementById('answerInput').value = '';
            document.getElementById('answerInput').className = '';
        } else {
            document.getElementById('questionText').innerHTML = `${q.question}<br><span style="font-size: 0.65em; color: var(--soft); font-style: italic; margin-top: 10px; display: block; font-family: 'Montserrat', sans-serif; font-weight: 400;">(${q.ru})</span> <button class="btn-speak" onclick="speak(\`${q.question.replace(/`/g, "'")}\`, this)">🔊</button>`;
            inputArea.style.display = 'none';
            quizArea.style.display = 'flex';
            renderQuizOptions(q.options, q.correctIndex);
        }

        document.getElementById('questionHint').textContent = q.hint || '';
        document.getElementById('feedback').className = 'feedback';
        document.getElementById('totalCount').textContent = filtered.length;
        updateProgress();
    }

    function renderQuizOptions(options, correctIndex) {
        const container = document.getElementById('quizArea');
        container.innerHTML = '';
        options.forEach((opt, idx) => {
            const label = document.createElement('label');
            label.className = 'quiz-option';
            label.innerHTML = `<input type="radio" name="quizOption" value="${idx}"> ${opt} <button class="btn-speak" onclick="event.stopPropagation(); speak('${opt}', this)">🔊</button>`;
            label.onclick = (e) => {
                if (e.target.tagName !== 'BUTTON') {
                    document.querySelectorAll('.quiz-option').forEach(el => el.classList.remove('selected'));
                    label.classList.add('selected');
                    label.querySelector('input').checked = true;
                }
            };
            container.appendChild(label);
        });
    }

    function checkAnswer() {
        const filtered = filterQuestions();
        if (filtered.length === 0) return;
        const q = filtered[currentQuestion % filtered.length];
        const feedback = document.getElementById('feedback');
        const feedbackText = document.getElementById('feedbackText');
        const correctAnswer = document.getElementById('correctAnswer');

        if (currentMode === 'translation') {
            const userAnswer = document.getElementById('answerInput').value.trim().toLowerCase();
            const input = document.getElementById('answerInput');
            if (!userAnswer) { alert('Введите ответ!'); return; }
            const isCorrect = q.en.some(ans => ans.toLowerCase() === userAnswer);
            if (isCorrect) {
                correctCount++;
                input.className = 'correct';
                feedback.className = 'feedback correct';
                feedbackText.textContent = '✅ Правильно! Отличная работа!';
                
                // Автоозвучка правильного ответа
                if (document.getElementById('autoSpeak').checked) {
                    setTimeout(() => speak(q.en[0]), 500);
                }
            } else {
                incorrectCount++;
                input.className = 'incorrect';
                feedback.className = 'feedback incorrect';
                feedbackText.textContent = '❌ Неправильно. Правильный ответ:';
            }
            correctAnswer.innerHTML = `${q.en.join(' / ')} <button class="btn-speak" onclick="speak('${q.en[0]}', this)">🔊</button>`;
        } else {
            const selected = document.querySelector('input[name="quizOption"]:checked');
            if (!selected) { alert('Выберите вариант ответа!'); return; }
            const isCorrect = parseInt(selected.value) === q.correctIndex;
            
            const options = document.querySelectorAll('.quiz-option');
            options[q.correctIndex].classList.add('correct-opt');
            if (!isCorrect) {
                options[parseInt(selected.value)].classList.add('incorrect-opt');
                incorrectCount++;
                feedback.className = 'feedback incorrect';
                feedbackText.textContent = '❌ Неправильно. Правильный ответ:';
            } else {
                correctCount++;
                feedback.className = 'feedback correct';
                feedbackText.textContent = '✅ Правильно! Отличная работа!';
                
                // Автоозвучка правильного ответа
                if (document.getElementById('autoSpeak').checked) {
                    setTimeout(() => speak(q.options[q.correctIndex]), 500);
                }
            }
            correctAnswer.innerHTML = `${q.options[q.correctIndex]} <button class="btn-speak" onclick="speak('${q.options[q.correctIndex]}', this)">🔊</button>`;
        }
        updateStats();
        setTimeout(() => nextQuestion(), 2000);
    }

    function nextQuestion() {
        currentQuestion++;
        loadQuestion();
    }

    function updateStats() {
        document.getElementById('correctCount').textContent = correctCount;
        document.getElementById('incorrectCount').textContent = incorrectCount;
    }

    function updateProgress() {
        const filtered = filterQuestions();
        const progress = ((currentQuestion % filtered.length) / filtered.length) * 100;
        document.getElementById('progressBar').style.width = progress + '%';
    }

    function shuffleQuestions() {
        shuffleArray(shuffledQuestions);
        shuffleArray(shuffledQuiz);
        currentQuestion = 0;
        loadQuestion();
    }

    function resetStats() {
        correctCount = 0;
        incorrectCount = 0;
        currentQuestion = 0;
        updateStats();
        loadQuestion();
    }

    function populateVocabularyTable() {
        const tbody = document.getElementById('vocabularyTableBody');
        tbody.innerHTML = '';
        
        const allItems = [...questions, ...quizQuestions.map(q => ({
            ru: q.ru,
            en: [q.options[q.correctIndex]],
            category: q.category,
            hint: q.hint
        }))];

        allItems.forEach(q => {
            const row = document.createElement('tr');
            
            const ruCell = document.createElement('td');
            ruCell.className = 'ru-word';
            ruCell.textContent = q.ru;
            
            const enCell = document.createElement('td');
            enCell.className = 'en-word';
            enCell.innerHTML = `${Array.isArray(q.en) ? q.en.join(' / ') : q.en} <button class="btn-speak" onclick="speak('${Array.isArray(q.en) ? q.en[0] : q.en}', this)">🔊</button>`;
            
            const categoryCell = document.createElement('td');
            const badge = document.createElement('span');
            badge.className = 'category-badge';
            badge.textContent = q.category;
            categoryCell.appendChild(badge);
            
            const hintCell = document.createElement('td');
            hintCell.className = 'hint-text';
            hintCell.textContent = q.hint || '';
            
            row.appendChild(ruCell);
            row.appendChild(enCell);
            row.appendChild(categoryCell);
            row.appendChild(hintCell);
            tbody.appendChild(row);
        });
    }

    document.getElementById('tableSearch').addEventListener('input', function(e) {
        const searchTerm = e.target.value.toLowerCase().trim();
        const rows = document.querySelectorAll('#vocabularyTableBody tr');
        
        rows.forEach(row => {
            const text = row.textContent.toLowerCase();
            if (text.includes(searchTerm)) {
                row.style.display = '';
            } else {
                row.style.display = 'none';
            }
        });
    });

    function toggleVocabularyTable() {
        const container = document.getElementById('vocabularyTableContainer');
        const btn = document.querySelector('.toggle-table-btn');
        if (container.classList.contains('active')) {
            container.classList.remove('active');
            btn.textContent = '📚 Показать все слова';
        } else {
            container.classList.add('active');
            btn.textContent = ' Скрыть таблицу';
            container.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
        }
    }

    document.getElementById('answerInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') checkAnswer();
    });

    document.getElementById('modeSelect').addEventListener('change', function() {
        currentMode = this.value;
        currentQuestion = 0;
        loadQuestion();
    });

    document.getElementById('categorySelect').addEventListener('change', function() {
        currentQuestion = 0;
        loadQuestion();
    });

    init();
</script>
</body>
</html>
